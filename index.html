<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e3c8c">
<title>Friends Domino</title>

<style>:root{--gold:#d4af5f;--navy:#071a45;--blue:#0e3c8c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{
  background:radial-gradient(ellipse at 50% -10%,#1a56b8,var(--blue) 40%,var(--navy));
  background-attachment:fixed;color:#fff;
  font-family:system-ui,"Noto Sans Bengali","Segoe UI",sans-serif;
}
#app{max-width:560px;margin:0 auto;padding:12px;display:flex;flex-direction:column;gap:10px;min-height:100vh}
@media(min-width:860px){#app{max-width:880px}}

h1{margin:0;font-size:28px}
.hero{display:flex;align-items:center;gap:12px;justify-content:center;padding:6px 0}
.logo{width:72px;height:72px;border-radius:16px;box-shadow:0 4px 14px rgba(0,0,0,.5)}
small{opacity:.8}
label{display:block;margin-bottom:6px}

button{font:inherit;font-size:16px;border:1px solid var(--gold);border-radius:12px;padding:12px 14px;
  background:rgba(7,26,69,.85);color:#fff;cursor:pointer}
button.gold,button.sel{background:linear-gradient(#e8c877,#c19a43);color:#1a1200;border-color:#8a6a1f;font-weight:700}
button.big{font-size:19px;padding:15px}
button.sm{padding:8px 12px;font-size:15px}
button:disabled{opacity:.4;cursor:default}

input{width:100%;font:inherit;font-size:18px;padding:12px;border-radius:10px;border:1px solid var(--gold);
  background:rgba(0,0,0,.35);color:#fff}
input.codein{text-transform:uppercase;letter-spacing:6px;text-align:center;font-size:24px}

.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row>button{flex:1}
.top{flex-wrap:nowrap}
.grow{flex:1}.ctr{text-align:center}
.card{background:rgba(7,26,69,.7);border:1px solid rgba(212,175,95,.35);border-radius:14px;padding:12px}
.card .row{margin-top:8px}
.msg{background:#7a1f1f;border-radius:10px;padding:10px;text-align:center}

/* ---- tiles: black with gold pips ---- */
.tile{--h:34px;display:inline-flex;padding:3px;border-radius:9px;
  background:linear-gradient(145deg,#2e2e2e,#0a0a0a 70%);
  border:1px solid #000;box-shadow:0 2px 5px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.14)}
.tile.s{--h:21px;border-radius:6px;padding:2px}
.tile.v{flex-direction:column}
@media(min-width:860px){.tile{--h:44px}.tile.s{--h:27px}}
.half{width:var(--h);height:var(--h);display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:14%}
.half b{display:block;border-radius:50%}
.half b.on{margin:10%;background:radial-gradient(circle at 35% 30%,#fff3bd,#d4af5f 55%,#8a6a1f)}
.tile i{background:var(--gold);opacity:.95;display:block}
.tile.v i{height:2px;margin:0 5px}
.tile:not(.v) i{width:2px;margin:5px 0}
.tile.back .half{visibility:hidden}

/* ---- marble board ---- */
.board{
  min-height:120px;padding:10px;border-radius:16px;border:4px solid var(--gold);
  display:flex;flex-wrap:wrap;gap:4px;align-content:flex-start;justify-content:center;
  background:
    repeating-linear-gradient(115deg,transparent 0 46px,rgba(110,100,90,.09) 47px 48px),
    radial-gradient(circle at 18% 12%,rgba(255,255,255,.95),transparent 45%),
    linear-gradient(120deg,#f4f2ef,#e3dfd8 42%,#f7f5f2 62%,#d8d3cb);
  box-shadow:0 6px 18px rgba(0,0,0,.5),inset 0 0 20px rgba(0,0,0,.15);color:#222;
}
.board.mexb{display:block}
.train{display:flex;align-items:center;gap:5px;margin:4px 0;flex-wrap:wrap;font-size:13px;padding:2px 4px;border-radius:10px}
.train .name{min-width:84px;font-weight:600}
.train.openT .name{color:#a05a00}
.train.target{outline:3px dashed #b8860b;background:rgba(212,175,95,.25);cursor:pointer}

/* ---- floating hidden boneyard ---- */
.yardbox{position:relative;height:118px;border-radius:14px;overflow:hidden;
  border:2px dashed rgba(212,175,95,.55);background:rgba(0,0,0,.28)}
.yardbox.tap{border-color:#ffd978;cursor:pointer;box-shadow:0 0 12px rgba(255,217,120,.5)}
.yardbox .tile{position:absolute;animation:bob 3.4s ease-in-out infinite}
.ylabel{position:absolute;right:10px;bottom:6px;font-size:13px;z-index:2;background:rgba(0,0,0,.45);padding:2px 8px;border-radius:8px}
@keyframes bob{0%,100%{transform:translateY(0) rotate(var(--r))}50%{transform:translateY(-7px) rotate(var(--r))}}

/* ---- players / hand ---- */
.opps{gap:8px}
.opp{flex:1;min-width:90px;text-align:center;border-radius:12px;padding:8px;font-size:14px;
  background:rgba(7,26,69,.75);border:1px solid rgba(212,175,95,.3)}
.opp.turn{outline:2px solid var(--gold);box-shadow:0 0 10px rgba(212,175,95,.6)}
.opp.off{opacity:.55}
.status{text-align:center;min-height:24px;font-weight:700;font-size:17px}
.last{text-align:center;font-size:13px;opacity:.85;margin-top:-6px}
.hand{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:6px 0 14px}
.hand .tile{cursor:pointer;transition:transform .1s}
.hand .tile.dim{opacity:.4}
.hand .tile.sel{outline:3px solid var(--gold);transform:translateY(-6px)}

/* ---- lobby ---- */
.code{font-size:44px;font-weight:800;letter-spacing:8px;text-align:center;color:var(--gold)}
.plist{list-style:none;margin:8px 0 0;padding:0}
.plist li{padding:8px 4px;border-bottom:1px solid rgba(255,255,255,.12)}
</style>

<script>(function (root) {
'use strict';

// Hand size by player count. 2-4 players use a double-six set (28 tiles),
// 5-7 players use a double-nine set (55 tiles).
const HANDS = { 2: 7, 3: 6, 4: 5, 5: 7, 6: 7, 7: 7 };
const maxFor = n => (n <= 4 ? 6 : 9);
const pips = x => x[0] + x[1];

function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

// seats: [{uid, name, bot}]
function createGame(mode, seats) {
  const n = seats.length, M = maxFor(n);
  let deck = [];
  for (let a = 0; a <= M; a++) for (let b = a; b <= M; b++) deck.push([a, b]);
  shuffle(deck);
  const G = {
    mode, n, M, seats, hands: [], yard: [], turn: 0,
    line: [], L: null, R: null, trains: null, mex: null,
    passStreak: 0, drawn: false, extra: false, over: null, seq: 0, last: null
  };
  if (mode === 'mex') {
    deck = deck.filter(x => !(x[0] === M && x[1] === M));
    G.trains = [];
    for (let i = 0; i < n; i++) G.trains.push({ tiles: [], end: M, open: false });
    G.mex = { tiles: [], end: M };
  }
  for (let p = 0; p < n; p++) G.hands.push(deck.splice(0, HANDS[n]));
  G.yard = deck;
  if (mode !== 'mex') {
    // starter: highest double, otherwise highest tile
    let best = 0, bp = -1, bi = 0;
    G.hands.forEach((h, p) => h.forEach((x, i) => {
      const sc = (x[0] === x[1] ? 100 : 0) + pips(x);
      if (sc > bp) { bp = sc; best = p; bi = i; }
    }));
    const tile = G.hands[best].splice(bi, 1)[0];
    G.line = [tile]; G.L = tile[0]; G.R = tile[1];
    G.turn = (best + 1) % n;
    G.last = { p: best, type: 'play' };
  }
  return G;
}

// Where can tile x go for player p? Line modes: 'L' / 'R'. Mexican: train owner index or 'm'.
function targetsFor(G, p, x) {
  const r = [];
  if (G.mode === 'mex') {
    const chk = (end, key) => { if (x[0] === end || x[1] === end) r.push(key); };
    chk(G.trains[p].end, p);
    chk(G.mex.end, 'm');
    for (let q = 0; q < G.n; q++) if (q !== p && G.trains[q].open) chk(G.trains[q].end, q);
    return r;
  }
  if (x[0] === G.L || x[1] === G.L) r.push('L');
  if (x[0] === G.R || x[1] === G.R) r.push('R');
  return r;
}

const legal = (G, p) =>
  G.hands[p].map((x, i) => ({ i, x, targets: targetsFor(G, p, x) })).filter(m => m.targets.length);

function canDraw(G) {
  if (!G.yard.length) return false;
  if (G.mode === 'draw') return true;
  if (G.mode === 'mex') return !G.drawn;
  return false;
}

function advance(G) {
  if (G.extra) G.extra = false; else G.turn = (G.turn + 1) % G.n;
  G.drawn = false;
}

function doPlay(G, p, i, tg) {
  const x = G.hands[p].splice(i, 1)[0];
  G.passStreak = 0;
  if (G.mode === 'mex') {
    const tr = tg === 'm' ? G.mex : G.trains[tg];
    const o = x[0] === tr.end ? [x[0], x[1]] : [x[1], x[0]];
    tr.tiles.push(o); tr.end = o[1];
    if (tg === p) tr.open = false;
    G.extra = x[0] === x[1];
  } else if (tg === 'L') {
    const o = x[1] === G.L ? [x[0], x[1]] : [x[1], x[0]];
    G.line.unshift(o); G.L = o[0];
  } else {
    const o = x[0] === G.R ? [x[0], x[1]] : [x[1], x[0]];
    G.line.push(o); G.R = o[1];
  }
  G.seq++; G.last = { p, type: 'play' };
  if (!G.hands[p].length) { G.over = { w: p, blocked: false }; return true; }
  advance(G);
  return true;
}

function doPass(G, p) {
  G.passStreak++; G.seq++; G.last = { p, type: 'pass' };
  if (G.mode === 'mex') G.trains[p].open = true;
  if (G.passStreak >= G.n && (G.mode === 'block' || !G.yard.length)) {
    let w = 0, m = 1e9;
    G.hands.forEach((h, q) => { const s = h.reduce((a, x) => a + pips(x), 0); if (s < m) { m = s; w = q; } });
    G.over = { w, blocked: true };
    return true;
  }
  G.extra = false;
  advance(G);
  return true;
}

// a = {type:'play', i, tg} | {type:'draw'} | {type:'pass'}. Returns true if applied.
function applyAction(G, p, a) {
  if (!G || G.over || G.turn !== p || !a) return false;
  const mv = legal(G, p);
  if (a.type === 'play') {
    const h = G.hands[p];
    if (!Number.isInteger(a.i) || a.i < 0 || a.i >= h.length) return false;
    if (!targetsFor(G, p, h[a.i]).includes(a.tg)) return false;
    return doPlay(G, p, a.i, a.tg);
  }
  if (a.type === 'draw') {
    if (mv.length || !canDraw(G)) return false;
    G.hands[p].push(G.yard.pop());
    G.drawn = true; G.seq++; G.last = { p, type: 'draw' };
    return true;
  }
  if (a.type === 'pass') {
    if (mv.length || canDraw(G)) return false;
    return doPass(G, p);
  }
  return false;
}

function botChoose(G, p) {
  const mv = legal(G, p);
  if (mv.length) {
    let best = null, bs = -1;
    mv.forEach(m => m.targets.forEach(tg => {
      const sc = pips(m.x) + (m.x[0] === m.x[1] ? 20 : 0) + (G.mode === 'mex' && tg === p ? 8 : 0) + Math.random();
      if (sc > bs) { bs = sc; best = { type: 'play', i: m.i, tg }; }
    }));
    return best;
  }
  if (canDraw(G)) return { type: 'draw' };
  return { type: 'pass' };
}

// What every player may see (no hands, no yard contents).
function publicState(G) {
  const pub = {};
  Object.keys(G).forEach(k => { if (k !== 'hands' && k !== 'yard') pub[k] = G[k]; });
  pub.counts = G.hands.map(h => h.length);
  pub.yardCount = G.yard.length;
  return pub;
}

// Rebuild a G-shaped object for a client: only my hand is real.
function makeView(pub, myIdx, myHand) {
  const V = JSON.parse(JSON.stringify(pub));
  V.hands = pub.counts.map((c, i) => (i === myIdx ? (myHand || []).slice() : new Array(c).fill(null)));
  V.yard = new Array(pub.yardCount).fill(null);
  return V;
}

const Engine = { HANDS, maxFor, pips, createGame, targetsFor, legal, canDraw, applyAction, botChoose, publicState, makeView };
if (typeof module !== 'undefined' && module.exports) module.exports = Engine;
root.Engine = Engine;
})(typeof window !== 'undefined' ? window : globalThis);
</script>
<script>'use strict';
// Online layer: Firebase Anonymous Auth (guest) + Realtime Database.
// The room host runs the game; other players send actions, the host validates and publishes state.
// Each player's hand is stored at a path only that player (and the host) can read.
const Online = (function () {
  const LS = 'fd_room';
  let D = null, db = null, uid = null, code = null, host = false, meta = null, players = {};
  let unsubs = [], pend = { pub: null, hand: null };
  const api = { onLobby: null, onView: null, onRemoteAction: null, onPlayers: null, onClosed: null };

  const r = p => (p ? D.ref(db, p) : D.ref(db));
  const AL = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  const gen = () => { let s = ''; for (let i = 0; i < 5; i++) s += AL[Math.floor(Math.random() * AL.length)]; return s; };
  const store = (k, v) => { try { if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { } };

  function sorted() {
    return Object.keys(players).map(u => Object.assign({ uid: u }, players[u])).filter(p => p.name)
      .sort((a, b) => (a.t || 0) - (b.t || 0) || (a.uid < b.uid ? -1 : 1));
  }
  const lobbyCb = () => { if (api.onLobby) api.onLobby({ meta, players: sorted() }); };

  async function init() {
    if (db) return;
    const c = window.FB_CONFIG;
    if (!c || !c.apiKey || /PASTE/i.test(c.apiKey) || !c.databaseURL || /PASTE/i.test(c.databaseURL)) throw new Error('NOCONFIG');
    const B = 'https://www.gstatic.com/firebasejs/10.12.2/';
    let A, Au, Da;
    try {
      [A, Au, Da] = await Promise.all([import(B + 'firebase-app.js'), import(B + 'firebase-auth.js'), import(B + 'firebase-database.js')]);
    } catch (e) { throw new Error('NET'); }
    const app = A.initializeApp(c);
    const auth = Au.getAuth(app);
    try {
      await auth.authStateReady();
      if (!auth.currentUser) await Au.signInAnonymously(auth);
    } catch (e) { throw new Error('AUTH'); }
    uid = auth.currentUser.uid;
    D = Da; db = Da.getDatabase(app);
  }

  function stopWatch() {
    unsubs.forEach(f => { try { f(); } catch (e) { } });
    unsubs = []; pend = { pub: null, hand: null }; players = {}; meta = null;
  }

  function tryView() {
    if (!pend.pub || !pend.hand || pend.pub.q !== pend.hand.q) return;
    const pub = pend.pub.s;
    const idx = pub.seats.findIndex(s => s.uid === uid);
    if (idx < 0) return;
    if (api.onView) api.onView(Engine.makeView(pub, idx, pend.hand.h), idx);
  }

  function watch() {
    stopWatch();
    const base = 'rooms/' + code + '/';
    const on = (path, cb) => unsubs.push(D.onValue(r(path), cb));
    on(base + 'meta', s => {
      meta = s.val();
      if (meta && meta.status === 'closed' && api.onClosed) api.onClosed();
      lobbyCb();
    });
    on(base + 'players', s => { players = s.val() || {}; lobbyCb(); if (api.onPlayers) api.onPlayers(); });
    on('.info/connected', s => {
      if (s.val() && code) {
        const pr = r(base + 'players/' + uid + '/on');
        D.onDisconnect(pr).set(false);
        D.set(pr, true);
      }
    });
    if (!host) {
      on(base + 'state', s => { const v = s.val(); pend.pub = v ? { q: v.q, s: JSON.parse(v.s) } : null; tryView(); });
      on(base + 'hands/' + uid, s => { const v = s.val(); pend.hand = v ? JSON.parse(v) : null; tryView(); });
    } else {
      unsubs.push(D.onChildAdded(r(base + 'actions'), s => {
        const v = s.val();
        D.remove(s.ref);
        if (v && api.onRemoteAction) api.onRemoteAction(v.u, v.a, v.q);
      }));
    }
  }

  async function createRoom(mode, name) {
    for (let k = 0; k < 5; k++) {
      const c = gen();
      const s = await D.get(r('rooms/' + c + '/meta'));
      if (!s.exists()) {
        await D.set(r('rooms/' + c + '/meta'), { host: uid, mode, status: 'lobby', t: Date.now() });
        await D.set(r('rooms/' + c + '/players/' + uid), { name, t: Date.now(), on: true });
        code = c; host = true; store(LS, JSON.stringify({ code }));
        watch();
        return c;
      }
    }
    throw new Error('NET');
  }

  async function joinRoom(c, name) {
    c = (c || '').toUpperCase().trim();
    if (c.length < 4) throw new Error('NOROOM');
    const s = await D.get(r('rooms/' + c + '/meta'));
    if (!s.exists() || s.val().status === 'closed') throw new Error('NOROOM');
    const m = s.val();
    const ps = (await D.get(r('rooms/' + c + '/players'))).val() || {};
    const mine = ps[uid] && ps[uid].name;
    if (m.status === 'playing' && !mine) throw new Error('STARTED');
    if (!mine && Object.keys(ps).filter(u => ps[u].name).length >= 7) throw new Error('FULL');
    code = c; host = (m.host === uid);
    await D.set(r('rooms/' + c + '/players/' + uid), { name, t: (ps[uid] && ps[uid].t) || Date.now(), on: true });
    store(LS, JSON.stringify({ code }));
    watch();
    return c;
  }

  // Come back to a room after a reload. Host also restores the full game state.
  async function rejoin(name) {
    let sv = null;
    try { sv = JSON.parse(localStorage.getItem(LS) || 'null'); } catch (e) { }
    if (!sv || !sv.code) throw new Error('NOROOM');
    const c = sv.code;
    const s = await D.get(r('rooms/' + c + '/meta'));
    if (!s.exists() || s.val().status === 'closed') { store(LS, null); throw new Error('NOROOM'); }
    const m = s.val();
    const ps = (await D.get(r('rooms/' + c + '/players'))).val() || {};
    code = c; host = (m.host === uid);
    await D.set(r('rooms/' + c + '/players/' + uid), { name, t: (ps[uid] && ps[uid].t) || Date.now(), on: true });
    let G = null;
    if (host && m.status === 'playing') {
      const hs = await D.get(r('rooms/' + c + '/hostState'));
      if (hs.exists()) G = JSON.parse(hs.val());
    }
    watch();
    return { host, G };
  }

  async function leave() {
    const c = code, h = host, playing = meta && meta.status === 'playing';
    stopWatch(); store(LS, null); code = null; host = false;
    if (!db || !c) return;
    try {
      if (h) await D.update(r('rooms/' + c + '/meta'), { status: 'closed' });
      else if (playing) await D.update(r('rooms/' + c + '/players/' + uid), { on: false });
      else await D.remove(r('rooms/' + c + '/players/' + uid));
    } catch (e) { }
  }

  // Host: freeze the lobby and return the seats (everyone currently online).
  async function lockLobby() {
    const ps = sorted().filter(p => p.on !== false);
    if (ps.length >= 2) await D.update(r('rooms/' + code + '/meta'), { status: 'playing' });
    return ps.map(p => ({ uid: p.uid, name: p.name, bot: false }));
  }

  function publish(G) {
    if (!db || !host || !code) return;
    const base = 'rooms/' + code + '/', u = {};
    u[base + 'state'] = { q: G.seq, s: JSON.stringify(Engine.publicState(G)) };
    G.seats.forEach((s, i) => { if (s.uid && !s.bot && s.uid !== uid) u[base + 'hands/' + s.uid] = JSON.stringify({ q: G.seq, h: G.hands[i] }); });
    u[base + 'hostState'] = JSON.stringify(G);
    D.update(r(''), u).catch(() => { });
  }

  function sendAction(a, q) {
    if (!db || !code) return;
    D.push(r('rooms/' + code + '/actions'), { u: uid, q, a }).catch(() => { });
  }

  return Object.assign(api, {
    init, createRoom, joinRoom, rejoin, leave, lockLobby, publish, sendAction,
    isOffline: u => !players[u] || players[u].on === false,
    me: () => uid, code: () => code
  });
})();
</script>
<script>'use strict';

const PIPS = [[], [4], [0, 8], [0, 4, 8], [0, 2, 6, 8], [0, 2, 4, 6, 8], [0, 2, 3, 5, 6, 8],
  [0, 2, 3, 4, 5, 6, 8], [0, 1, 2, 3, 5, 6, 7, 8], [0, 1, 2, 3, 4, 5, 6, 7, 8]];

const T = {
  bn: {

// ---------- state ----------
function ls(k, v) {
  try { if (v === undefined) return localStorage.getItem(k); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { }
  return null;
}
let lang = ls('fd_lang') || 'bn';
let screen = 'menu';          // menu | online | lobby | game
let net = 'solo';             // solo | host | client
let G = null, ME = 0, sel = null, msg = '', joinCode = '', botTimer = null, copied = false;
let lobby = { meta: null, players: [] };
const S = { mode: 'draw', bots: 1 };

const t = k => (T[lang][k] !== undefined ? T[lang][k] : k);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function getName() {
  let n = ls('fd_name');
  if (!n) { n = 'Guest-' + Math.floor(1000 + Math.random() * 9000); ls('fd_name', n); }
  return n;
}
function setName(v) { v = (v || '').trim().slice(0, 16); if (v) ls('fd_name', v); }
function nameOf(p) { const s = G.seats[p]; return s.bot ? t('bot') + ' ' + p : esc(s.name); }

// ---------- tile drawing ----------
function half(n) {
  let s = '<div class="half">';
  for (let c = 0; c < 9; c++) s += '<b' + (PIPS[n].includes(c) ? ' class="on"' : '') + '></b>';
  return s + '</div>';
}
function tileHTML(x, cls, attr) { return `<div class="tile ${cls || ''}" ${attr || ''}>${half(x[0])}<i></i>${half(x[1])}</div>`; }
function backHTML(style) { return `<div class="tile s back" style="${style}">${half(0)}<i></i>${half(0)}</div>`; }

// ---------- game flow ----------
function afterChange() {
  render();
  if (net === 'host') Online.publish(G);
  scheduleBots();
}

function act(a) {
  if (net === 'client') { Online.sendAction(a, G.seq); sel = null; render(); return; }
  if (Engine.applyAction(G, ME, a)) { sel = null; afterChange(); }
}

function scheduleBots() {
  clearTimeout(botTimer);
  if (!G || G.over || net === 'client') return;
  const s = G.seats[G.turn];
  let delay = null;
  if (s.bot) delay = 700;
  else if (net === 'host' && s.uid !== Online.me() && Online.isOffline(s.uid)) delay = 6000;
  if (delay === null) return;
  const sq = G.seq, tp = G.turn;
  botTimer = setTimeout(() => {
    if (!G || G.over || G.seq !== sq || G.turn !== tp) return;
    if (!s.bot && !Online.isOffline(s.uid)) return;
    Engine.applyAction(G, tp, Engine.botChoose(G, tp));
    afterChange();
  }, delay);
}

function startSolo() {
  msg = ''; net = 'solo';
  const seats = [{ uid: 'me', name: getName(), bot: false }];
  for (let i = 0; i < S.bots; i++) seats.push({ uid: 'bot' + i, name: 'Bot', bot: true });
  G = Engine.createGame(S.mode, seats);
  ME = 0; sel = null; screen = 'game';
  afterChange();
}

function tapTile(i) {
  if (!G || G.over || G.turn !== ME) return;
  const tg = Engine.targetsFor(G, ME, G.hands[ME][i]);
  if (!tg.length) { sel = null; return render(); }
  if (tg.length === 1) return act({ type: 'play', i, tg: tg[0] });
  sel = i; render();
}
function tapTarget(tg) { if (sel !== null) act({ type: 'play', i: sel, tg }); }
function humanDraw() {
  if (G && !G.over && G.turn === ME && !Engine.legal(G, ME).length && Engine.canDraw(G)) act({ type: 'draw' });
}
function humanPass() {
  if (G && !G.over && G.turn === ME && !Engine.legal(G, ME).length && !Engine.canDraw(G)) act({ type: 'pass' });
}

function toggleLang() { lang = lang === 'bn' ? 'en' : 'bn'; ls('fd_lang', lang); render(); }
function toMenu() { clearTimeout(botTimer); G = null; net = 'solo'; screen = 'menu'; render(); }

// ---------- online flow ----------
function err(e) {
  const k = (e && e.message) || '';
  msg = T[lang]['e_' + k] || t('e_other');
  render();
}
function goOnline() { msg = ''; screen = 'online'; render(); }

async function createRoomUI() {
  try {
    msg = ''; await Online.init();
    await Online.createRoom(S.mode, getName());
    net = 'host'; screen = 'lobby'; render();
  } catch (e) { err(e); }
}
async function joinRoomUI() {
  try {
    msg = ''; await Online.init();
    await Online.joinRoom(joinCode, getName());
    net = 'client'; screen = 'lobby'; render();
  } catch (e) { err(e); }
}
async function rejoinUI() {
  try {
    msg = ''; await Online.init();
    const r = await Online.rejoin(getName());
    if (r.host) {
      net = 'host';
      if (r.G) { G = r.G; ME = G.seats.findIndex(s => s.uid === Online.me()); screen = 'game'; afterChange(); }
      else { screen = 'lobby'; render(); }
    } else { net = 'client'; screen = 'lobby'; render(); }
  } catch (e) { err(e); }
}
async function startOnline() {
  try {
    const seats = await Online.lockLobby();
    if (seats.length < 2) { msg = t('need2'); render(); return; }
    const mode = (lobby.meta && lobby.meta.mode) || S.mode;
    G = Engine.createGame(mode, seats);
    G.seq = Math.floor(Date.now() / 1000);
    ME = G.seats.findIndex(s => s.uid === Online.me());
    net = 'host'; sel = null; msg = ''; screen = 'game';
    afterChange();
  } catch (e) { err(e); }
}
async function leaveUI() {
  clearTimeout(botTimer);
  await Online.leave();
  G = null; net = 'solo'; screen = 'menu'; msg = ''; render();
}
function copyCode() {
  try { navigator.clipboard.writeText(Online.code()); copied = true; render(); setTimeout(() => { copied = false; render(); }, 1500); } catch (e) { }
}

Online.onLobby = L => { lobby = L; if (screen === 'lobby') render(); };
Online.onPlayers = () => {
  if (screen !== 'game') return;
  if (net === 'host') scheduleBots();
  render();
};
Online.onView = (V, idx) => { if (net !== 'client') return; G = V; ME = idx; sel = null; screen = 'game'; render(); };
Online.onRemoteAction = (u, a, q) => {
  if (!G || net !== 'host' || q !== G.seq) return;
  const p = G.seats.findIndex(s => s.uid === u);
  if (p < 0) return;
  if (Engine.applyAction(G, p, a)) afterChange();
};
Online.onClosed = () => {
  if (net === 'solo') return;
  clearTimeout(botTimer);
  Online.leave(); G = null; net = 'solo'; screen = 'menu'; msg = t('closed'); render();
};

    `<button class="${S.mode === k ? 'sel' : ''}" onclick="S.mode='${k}';render()">${t('mode_' + k)}${withDesc ? `<br><small>${t('d_' + k)}</small>` : ''}</button>`).join('');
}

function boardHTML() {
  if (G.mode === 'mex') {
    const row = (label, tr, key, open) => {
      const hit = sel !== null && Engine.targetsFor(G, ME, G.hands[ME][sel]).includes(key);
      const k = typeof key === 'string' ? `'${key}'` : key;
      return `<div class="train ${hit ? 'target' : ''} ${open ? 'openT' : ''}" ${hit ? `onclick="tapTarget(${k})"` : ''}>
        <span class="name">${label}${open ? ' (' + t('open') + ')' : ''}</span>${tileHTML([G.M, G.M], 's')}<span>›</span>${tr.tiles.map(x => tileHTML(x, 's')).join('')}</div>`;
    };
    let h = '<div class="board mexb">' + row(t('mexT'), G.mex, 'm', false);
    for (let k = 0; k < G.n; k++) {
      const p = (ME + k) % G.n;
      h += row(t('trainOf') + ' ' + nameOf(p), G.trains[p], p, G.trains[p].open);
    }
    return h + '</div>';
  }
  let h = `<div class="board">${G.line.map(x => tileHTML(x, 's')).join('')}</div>`;
  if (sel !== null) {
    const tg = Engine.targetsFor(G, ME, G.hands[ME][sel]);
    h += `<div class="status">${t('pick')}</div><div class="row">${tg.map(k => `<button class="gold" onclick="tapTarget('${k}')">${t(k === 'L' ? 'left' : 'right')}</button>`).join('')}</div>`;
  }
  return h;
}

function yardHTML(canTap) {
  const n = G.yard.length;
  let tiles = '';
  for (let i = 0; i < n; i++) {
    const left = (i * 47 + 5) % 86 + 2, top = (i * 29 + 11) % 58 + 4, r = ((i * 53) % 70) - 35;
    tiles += backHTML(`left:${left}%;top:${top}%;--r:${r}deg;animation-delay:${(i % 7) * -0.45}s`);
  }
  return `<div class="yardbox ${canTap ? 'tap' : ''}" onclick="humanDraw()">${tiles}<div class="ylabel">${t('yard')}: ${n}</div></div>`;
}

function gameHTML() {
  const over = G.over, my = !over && G.turn === ME;
  const mv = my ? Engine.legal(G, ME) : [];
  const ok = new Set(mv.map(m => m.i));
  const canD = my && !mv.length && Engine.canDraw(G);
  const canP = my && !mv.length && !Engine.canDraw(G);
  let h = `<div class="row top"><button class="sm" onclick="${net === 'solo' ? 'toMenu()' : 'leaveUI()'}">☰</button>
    <div class="grow ctr">${t('mode_' + G.mode)}${net !== 'solo' ? ' · 🔑 ' + esc(Online.code() || '') : ''}</div>
    <button class="sm" onclick="toggleLang()">${t('lang')}</button></div>`;
  h += '<div class="row opps">';
  for (let k = 1; k < G.n; k++) {
    const p = (ME + k) % G.n, s = G.seats[p];
    const off = !s.bot && net !== 'solo' && Online.isOffline(s.uid);
    h += `<div class="opp ${G.turn === p && !over ? 'turn' : ''} ${off ? 'off' : ''}">${nameOf(p)}${off ? ' ⚪' : ''}<br><b>${G.hands[p].length}</b> ${t('tiles')}</div>`;
  }
  h += '</div>' + boardHTML() + yardHTML(canD);
  let st;
  if (over) {
    st = over.w === ME ? t('won') : t('winner') + nameOf(over.w);
    if (over.blocked) st += `<br><small>${t('blockedMsg')}</small>`;
  } else st = my ? t('yourTurn') : nameOf(G.turn) + t('turnOf');
  h += `<div class="status">${st}</div>`;
  if (G.last && !over) h += `<div class="last">${nameOf(G.last.p)} ${t('last_' + G.last.type)}</div>`;
  if (over) {
    if (net === 'solo') h += `<div class="row"><button class="gold" onclick="startSolo()">${t('newGame')}</button><button onclick="toMenu()">${t('menu')}</button></div>`;
    else if (net === 'host') h += `<div class="row"><button class="gold" onclick="startOnline()">${t('newGame')}</button><button onclick="leaveUI()">${t('leave')}</button></div>`;
    else h += `<div class="status"><small>${t('hostNew')}</small></div><button onclick="leaveUI()">${t('leave')}</button>`;
  } else if (canD) h += `<button class="gold" onclick="humanDraw()">${t('drawBtn')}</button>`;
  else if (canP) h += `<button class="gold" onclick="humanPass()">${t('passBtn')}</button>`;
  h += `<div class="hand">${G.hands[ME].map((x, i) =>
    tileHTML(x, 'v' + (sel === i ? ' sel' : '') + (my && !ok.has(i) ? ' dim' : ''), `onclick="tapTile(${i})"`)).join('')}</div>`;
  return h;
}

function render() {
  document.documentElement.lang = lang;
  const app = document.getElementById('app');
  if (screen === 'game' && G) app.innerHTML = gameHTML();
  else if (screen === 'online') app.innerHTML = onlineHTML();
  else if (screen === 'lobby') app.innerHTML = lobbyHTML();
  else app.innerHTML = menuHTML();
}

(function init() {
  try {
    const q = new URLSearchParams(location.search).get('room');
    if (q) { joinCode = q.toUpperCase().slice(0, 5); screen = 'online'; }
  } catch (e) { }
  render();
})();
</script>
</body>
