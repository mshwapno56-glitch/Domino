name: Build apps (APK + Windows)

on:
  workflow_dispatch: {}

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Prepare files
        run: |
          mkdir -p www assets
          cp index.html www/index.html
          cp icon.png assets/icon-only.png
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/assets@3
      - name: Create Android project
        run: |
          npx cap init "Friends Domino" com.friends.domino --web-dir www
          npx cap add android
          npx capacitor-assets generate --android --iconBackgroundColor '#0e3c8c' --iconBackgroundColorDark '#0e3c8c'
          npx cap sync android
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: FriendsDomino-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - name: Create Tauri project
        run: |
          mkdir -p www src-tauri/src src-tauri/capabilities
          cp index.html www/index.html
          cat > src-tauri/Cargo.toml <<'EOF'
          [package]
          name = "friends-domino"
          version = "1.0.0"
          edition = "2021"

          [build-dependencies]
          tauri-build = { version = "2", features = [] }

          [dependencies]
          tauri = { version = "2", features = [] }

          [profile.release]
          opt-level = "s"
          lto = true
          codegen-units = 1
          strip = true
          EOF
          cat > src-tauri/build.rs <<'EOF'
          fn main() { tauri_build::build() }
          EOF
          cat > src-tauri/src/main.rs <<'EOF'
          #![cfg_attr(not(debug_assertions), windows_subsystem = "windows")]
          fn main() {
              tauri::Builder::default()
                  .run(tauri::generate_context!())
                  .expect("error while running Friends Domino");
          }
          EOF
          cat > src-tauri/capabilities/default.json <<'EOF'
          {"identifier":"default","windows":["main"],"permissions":["core:default"]}
          EOF
          cat > src-tauri/tauri.conf.json <<'EOF'
          {
            "productName": "Friends Domino",
            "version": "1.0.0",
            "identifier": "com.friends.domino",
            "build": { "frontendDist": "../www" },
            "app": {
              "windows": [{ "title": "Friends Domino", "width": 1000, "height": 780, "minWidth": 380, "minHeight": 600 }],
              "security": { "csp": null }
            },
            "bundle": {
              "active": true,
              "targets": ["nsis"],
              "icon": ["icons/32x32.png", "icons/128x128.png", "icons/128x128@2x.png", "icons/icon.ico"]
            }
          }
          EOF
      - name: Build Windows app
        run: |
          npx --yes @tauri-apps/cli@2 icon icon.png
          npx --yes @tauri-apps/cli@2 build
      - uses: actions/upload-artifact@v4
        with:
          name: FriendsDomino-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/friends-domino.exe
